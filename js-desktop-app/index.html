<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Desktop App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>My Dashboard</h1>
        </header>
        <main id="main-content-area"> <!-- Added ID for easier JS targeting -->
            <div id="calendar-widget-area" draggable="true">
                <div id="compact-date-display" class="clickable">
                    <!-- Compact date will be rendered here by JS -->
                    <span id="compact-date-text">Loading...</span>
                </div>
                <div id="full-calendar-view" style="display: none;">
                    <!-- Full calendar (header + grid) will be rendered here by JS -->
                </div>
            </div>

            <div id="time-widget-area" draggable="true">
                <div id="compact-time-display" class="clickable"> <!-- This remains for the main PC clock -->
                    <!-- Live clock will be rendered here by JS -->
                    <span id="current-time-text">Loading time...</span>
                </div>


                <div id="time-settings-view" style="display: none;">
                    <h3>Time Settings</h3>

                    <div id="time-features-menu">
                        <button id="timer-feature-button" class="time-feature-btn">Timer</button>
                        <button id="network-time-feature-button" class="time-feature-btn">Network Time</button>
                        <button id="timezones-feature-button" class="time-feature-btn">Time Zones</button>
                    </div>
                    <hr class="feature-menu-divider">

                    <div id="timer-settings-section" class="time-feature-section" style="display:none;">
                        <!-- Timer UI from previous step will be moved here by JS or confirmed structure -->
                        <h4>Timer (Countdown)</h4>
                        <div id="timer-inputs">
                            <label for="timer-hours">H:</label>
                            <input type="number" id="timer-hours" min="0" max="99" value="0">
                            <label for="timer-minutes">M:</label>
                            <input type="number" id="timer-minutes" min="0" max="59" value="0">
                            <label for="timer-seconds">S:</label>
                            <input type="number" id="timer-seconds" min="0" max="59" value="0">
                        </div>
                        <div id="timer-display" class="time-display-box">00:00:00</div>
                        <div id="timer-controls">
                            <button id="start-timer">Start</button>
                            <button id="pause-timer" disabled>Pause</button>
                            <button id="reset-timer">Reset</button>
                        </div>
                    </div>

                    <div id="network-time-settings-section" class="time-feature-section" style="display:none;">
                         <h4>Network Time</h4>
                         <button id="sync-network-time-button">Sync Network Time</button>
                         <div id="network-time-display" class="time-display-box">Not synced yet.</div>
                    </div>

                    <div id="timezones-settings-section" class="time-feature-section" style="display:none;">
                        <h4>Additional Time Zones</h4>
                        <div class="timezone-selector-group">
                            <label for="timezone-select-1">Time Zone 1:</label>
                            <select id="timezone-select-1" class="timezone-select">
                                <!-- Options will be populated by JS -->
                            </select>
                            <div id="timezone-display-1" class="time-display-box">Select a zone</div>
                        </div>
                        <div class="timezone-selector-group">
                            <label for="timezone-select-2">Time Zone 2:</label>
                            <select id="timezone-select-2" class="timezone-select">
                                <!-- Options will be populated by JS -->
                            </select>
                            <div id="timezone-display-2" class="time-display-box">Select a zone</div>
                        </div>
                    </div>

                    <!-- This HR might be redundant if sections have their own bottom borders or spacing -->
                    <!-- <hr> -->
                    <button id="close-time-settings" style="margin-top: 15px;">Close Settings</button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
