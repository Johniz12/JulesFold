<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder - Upload Template</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Step 1: Upload Your Resume Template</h1>
        <p>Please upload an HTML file to be used as your resume template. The template should contain placeholders like {{name}}, {{email}}, etc., which will be replaced with your details.</p>
        <div class="form-group">
            <label for="template-upload">Upload HTML Template</label>
            <input type="file" id="template-upload" accept=".html,text/html">
        </div>
        <button id="proceed-btn">Proceed to Enter Details</button>
    </div>
    <script>
        document.getElementById('proceed-btn').addEventListener('click', function() {
            const fileInput = document.getElementById('template-upload');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select an HTML template file first.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const templateContent = event.target.result;
                localStorage.setItem('resumeTemplate', templateContent);
                window.location.href = 'details.html';
            };
            reader.onerror = function() {
                alert('Error reading the file.');
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
