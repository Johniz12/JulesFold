<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Grade School Examination</h1>
    </header>

    <main id="app-container">
        <div id="user-area">
            <h2>Welcome!</h2>
            <p>Please enter your name:</p>
            <input type="text" id="username-input" placeholder="Enter your name">

            <div id="category-filter-container">
                <label for="category-select">Choose a category:</label>
                <select id="category-select">
                    <option value="all">All Categories</option>
                    <!-- Categories will be populated by JavaScript -->
                </select>
            </div>

            <button id="start-quiz-button">Start Quiz</button>
            <!-- Removed "/ View History" for now, can be a separate button later -->
            <button id="toggle-add-question-form-button" style="margin-top: 10px;">Add New Question</button>
            <button id="view-history-button" style="margin-top: 10px;">View History</button>
        </div>

        <div id="add-question-area" class="hidden">
            <h2>Add a New Question</h2>
            <form id="add-question-form">
                <div>
                    <label for="manual-question-text">Question Text:</label>
                    <textarea id="manual-question-text" rows="3" required></textarea>
                </div>
                <div>
                    <label for="manual-option-a">Option A:</label>
                    <input type="text" id="manual-option-a" required>
                </div>
                <div>
                    <label for="manual-option-b">Option B:</label>
                    <input type="text" id="manual-option-b" required>
                </div>
                <div>
                    <label for="manual-option-c">Option C:</label>
                    <input type="text" id="manual-option-c">
                </div>
                <div>
                    <label for="manual-option-d">Option D:</label>
                    <input type="text" id="manual-option-d">
                </div>
                <div>
                    <label for="manual-correct-answer">Correct Answer:</label>
                    <select id="manual-correct-answer" required>
                        <option value="">--Select Correct Option--</option>
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                </div>
                <div>
                    <label for="manual-competency">Competency:</label>
                    <input type="text" id="manual-competency" required>
                </div>
                <div>
                    <label for="manual-grade-level">Grade Level (1-6):</label>
                    <input type="number" id="manual-grade-level" min="1" max="6" required>
                </div>
                <div class="form-actions">
                    <button type="submit" id="save-question-button">Save Question</button>
                    <button type="button" id="cancel-add-question-button">Cancel</button>
                </div>
            </form>
        </div>

        <div id="quiz-area" class="hidden"> <!-- Initially hidden -->
            <div id="question-container">
                <p id="question-text">Question text will appear here.</p>
            </div>

            <div id="options-container">
                <!-- Answer options will be dynamically inserted here -->
            </div>

            <div id="navigation-container">
                <button id="next-button">Next Question</button>
            </div>
        </div>

        <div id="score-area">
            <h2>Your Score: <span id="score-value">0</span></h2>
        </div>

        <div id="results-area" class="hidden">
            <h2>Quiz Completed!</h2>
            <p>Your final score is: <span id="final-score">0</span></p>
            <h3 id="assessed-grade-level-display" class="hidden">Assessed Grade Level: <span id="grade-level-value"></span></h3>
            <div id="recommendations">Recommendations will appear here.</div>
            <button id="review-answers-button">Review Answers</button>
            <button id="restart-button">Restart Quiz</button>
            <button id="change-user-button">Change User</button>
        </div>

        <div id="review-area" class="hidden">
            <h2>Review Your Answers</h2>
            <div id="review-content"></div>
            <button id="back-to-results-button">Back to Results</button>
        </div>

        <div id="history-area" class="hidden">
            <h2>Quiz History</h2>
            <div id="history-list">
                <!-- History items will be populated here -->
            </div>
            <button id="back-to-user-menu-button">Back to User Menu</button>
        </div>
    </main>

    <script src="js/app.js" defer></script>
</body>
</html>
