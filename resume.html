<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Resume</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div class="controls">
        <button id="back-btn">Back to Edit</button>
        <button id="save-html-btn">Save as HTML</button>
        <button id="save-jpg-btn">Save Screenshot (JPG)</button>
        <button id="save-pdf-btn">Generate PDF</button>
    </div>
    <div id="resume-content">
        <!-- The generated resume will be injected here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const template = localStorage.getItem('resumeTemplate');
            const dataJSON = localStorage.getItem('resumeData');
            const contentArea = document.getElementById('resume-content');

            if (!template || !dataJSON) {
                contentArea.innerHTML = '<h1>Error: Template or data not found. Please start over.</h1>';
                return;
            }

            let populatedTemplate = template;
            const data = JSON.parse(dataJSON);

            // Replace simple placeholders
            populatedTemplate = populatedTemplate.replace(/{{name}}/g, data.name || '');
            populatedTemplate = populatedTemplate.replace(/{{email}}/g, data.email || '');
            populatedTemplate = populatedTemplate.replace(/{{phone}}/g, data.phone || '');
            populatedTemplate = populatedTemplate.replace(/{{address}}/g, data.address || '');
            populatedTemplate = populatedTemplate.replace(/{{summary}}/g, data.summary || '');

            // Replace image source
            populatedTemplate = populatedTemplate.replace(/{{profile_picture_src}}/g, data.profilePicture || '#');

            // Handle skills
            if (data.skills) {
                const skillsList = data.skills.split(',').map(s => `<li>${s.trim()}</li>`).join('');
                populatedTemplate = populatedTemplate.replace(/{{skills_list}}/g, `<ul>${skillsList}</ul>`);
            } else {
                populatedTemplate = populatedTemplate.replace(/{{skills_list}}/g, '');
            }

            // Handle work experience
            let workHtml = '';
            if (data.workExperience) {
                data.workExperience.forEach(exp => {
                    if(exp.jobTitle) {
                        workHtml += `<div class="work-item"><h3>${exp.jobTitle} at ${exp.company || ''}</h3><p><em>${exp.startDate || ''} - ${exp.endDate || 'Present'}</em></p><p>${exp.description || ''}</p></div>`;
                    }
                });
            }
            populatedTemplate = populatedTemplate.replace(/{{work_experience}}/g, workHtml);

            // Handle education
            let eduHtml = '';
            if (data.education) {
                data.education.forEach(edu => {
                    if(edu.degree) {
                        eduHtml += `<div class="edu-item"><h3>${edu.degree}</h3><p>${edu.school || ''}</p><p><em>${edu.startDate || ''} - ${edu.endDate || 'Present'}</em></p></div>`;
                    }
                });
            }
            populatedTemplate = populatedTemplate.replace(/{{education}}/g, eduHtml);

            // Inject the final HTML into the content area
            contentArea.innerHTML = populatedTemplate;

            // --- BUTTON EVENT LISTENERS ---
            document.getElementById('back-btn').addEventListener('click', function() {
                window.location.href = 'details.html';
            });

            document.getElementById('save-html-btn').addEventListener('click', function() {
                // To create a downloadable standalone HTML, we should reconstruct the full HTML document
                const resumeContent = document.getElementById('resume-content').innerHTML;
                const originalTemplate = localStorage.getItem('resumeTemplate') || '';
                const headMatch = originalTemplate.match(/<head>([\s\S]*?)<\/head>/i);
                const headContent = headMatch ? headMatch[0] : '<head><meta charset="UTF-8"><title>Your Resume</title></head>';

                const fullHtml = `<!DOCTYPE html><html lang="en">${headContent}<body>${resumeContent}</body></html>`;

                const blob = new Blob([fullHtml], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'resume.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });

            // Save Screenshot Button
            document.getElementById('save-jpg-btn').addEventListener('click', function() {
                html2canvas(document.getElementById('resume-content'), { scale: 2 }).then(canvas => {
                    const a = document.createElement('a');
                    a.href = canvas.toDataURL('image/jpeg', 0.9);
                    a.download = 'resume.jpg';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                });
            });

            // Generate PDF Button
            document.getElementById('save-pdf-btn').addEventListener('click', function() {
                const content = document.getElementById('resume-content');
                const opt = {
                  margin:       0.5,
                  filename:     'resume.pdf',
                  image:        { type: 'jpeg', quality: 0.98 },
                  html2canvas:  { scale: 2 },
                  jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
                };
                html2pdf().from(content).set(opt).save();
            });
        });
    </script>
</body>
</html>
