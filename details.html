<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="text-align: right; margin-bottom: 1rem;">
            <a href="index.html" style="text-decoration: none; color: #333;">&larr; Back to Template Upload</a>
        </div>
        <h1>Resume Details</h1>
        <form id="resume-form">
            <div class="form-group">
                <label for="profile-picture">Profile Picture</label>
                <input type="file" id="profile-picture" name="profile-picture" accept="image/*">
                <img id="image-preview" src="#" alt="Image Preview" />
            </div>

            <h2>Personal Details</h2>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address">
            </div>

            <h2>Summary</h2>
            <div class="form-group">
                <textarea id="summary" name="summary" rows="5"></textarea>
            </div>

            <h2>Work Experience</h2>
            <div id="work-experience-container">
                <!-- Work experience sections will be added here dynamically -->
            </div>
            <button type="button" id="add-experience">Add Another Experience</button>

            <h2>Education</h2>
            <div id="education-container">
                <!-- Education sections will be added here dynamically -->
            </div>
            <button type="button" id="add-education">Add Another Education</button>

            <h2>Skills</h2>
            <div class="form-group">
                <textarea id="skills" name="skills" rows="5" placeholder="Enter skills, separated by commas"></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
    <script>
        // --- UTILITY FUNCTIONS ---
        function getBase64Image(img) {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            const dataURL = canvas.toDataURL("image/png");
            return dataURL;
        }

        // --- DYNAMIC SECTION CREATION FUNCTIONS ---
        function addWorkExperience(data = {}) {
            const container = document.getElementById('work-experience-container');
            const index = Date.now() + Math.random();
            const newExperience = document.createElement('div');
            newExperience.classList.add('experience');
            newExperience.innerHTML = `
                <hr>
                <div class="form-group">
                    <label for="job-title-${index}">Job Title</label>
                    <input type="text" id="job-title-${index}" name="job-title" value="${data.jobTitle || ''}">
                </div>
                <div class="form-group">
                    <label for="company-${index}">Company</label>
                    <input type="text" id="company-${index}" name="company" value="${data.company || ''}">
                </div>
                <div class="form-group">
                    <label for="start-date-${index}">Start Date</label>
                    <input type="date" id="start-date-${index}" name="start-date" value="${data.startDate || ''}">
                </div>
                <div class="form-group">
                    <label for="end-date-${index}">End Date</label>
                    <input type="date" id="end-date-${index}" name="end-date" value="${data.endDate || ''}">
                </div>
                <div class="form-group">
                    <label for="job-description-${index}">Description</label>
                    <textarea id="job-description-${index}" name="job-description" rows="5">${data.description || ''}</textarea>
                </div>
                <button type="button" class="delete-btn">Delete Experience</button>
            `;
            container.appendChild(newExperience);
        }

        function addEducation(data = {}) {
            const container = document.getElementById('education-container');
            const index = Date.now() + Math.random();
            const newEducation = document.createElement('div');
            newEducation.classList.add('education');
            newEducation.innerHTML = `
                <hr>
                <div class="form-group">
                    <label for="degree-${index}">Degree</label>
                    <input type="text" id="degree-${index}" name="degree" value="${data.degree || ''}">
                </div>
                <div class="form-group">
                    <label for="school-${index}">School/University</label>
                    <input type="text" id="school-${index}" name="school" value="${data.school || ''}">
                </div>
                <div class="form-group">
                    <label for="education-start-date-${index}">Start Date</label>
                    <input type="date" id="education-start-date-${index}" name="education-start-date" value="${data.startDate || ''}">
                </div>
                <div class="form-group">
                    <label for="education-end-date-${index}">End Date</label>
                    <input type="date" id="education-end-date-${index}" name="education-end-date" value="${data.endDate || ''}">
                </div>
                <button type="button" class="delete-btn">Delete Education</button>
            `;
            container.appendChild(newEducation);
        }

        // --- DOMContentLoaded: LOAD DATA and SET UP LISTENERS ---
        document.addEventListener('DOMContentLoaded', function() {
            // --- PRE-FILLING LOGIC ---
            const resumeDataJSON = localStorage.getItem('resumeData');
            if (resumeDataJSON) {
                const data = JSON.parse(resumeDataJSON);

                document.getElementById('name').value = data.name || '';
                document.getElementById('email').value = data.email || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('summary').value = data.summary || '';
                document.getElementById('skills').value = data.skills || '';

                if (data.profilePicture) {
                    const preview = document.getElementById('image-preview');
                    preview.src = data.profilePicture;
                    preview.style.display = 'block';
                }

                const workContainer = document.getElementById('work-experience-container');
                workContainer.innerHTML = '';
                if (data.workExperience && data.workExperience.length > 0) {
                    data.workExperience.forEach(exp => addWorkExperience(exp));
                } else {
                    addWorkExperience();
                }

                const eduContainer = document.getElementById('education-container');
                eduContainer.innerHTML = '';
                if (data.education && data.education.length > 0) {
                    data.education.forEach(edu => addEducation(edu));
                } else {
                    addEducation();
                }
            } else {
                addWorkExperience();
                addEducation();
            }

            // --- EVENT LISTENERS ---
            document.getElementById('profile-picture').addEventListener('change', function(event) {
                const preview = document.getElementById('image-preview');
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        preview.src = e.target.result;
                        preview.style.display = 'block';
                    }
                    reader.readAsDataURL(file);
                } else {
                    preview.src = '#';
                    preview.style.display = 'none';
                }
            });

            document.getElementById('add-experience').addEventListener('click', () => addWorkExperience());
            document.getElementById('add-education').addEventListener('click', () => addEducation());

            document.getElementById('work-experience-container').addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('delete-btn')) {
                    e.target.closest('.experience').remove();
                }
            });

            document.getElementById('education-container').addEventListener('click', function(e) {
                if (e.target && e.target.classList.contains('delete-btn')) {
                    e.target.closest('.education').remove();
                }
            });

            document.getElementById('resume-form').addEventListener('submit', function(event) {
                event.preventDefault();

                const resumeData = {
                    name: document.getElementById('name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    summary: document.getElementById('summary').value,
                    skills: document.getElementById('skills').value,
                    workExperience: [],
                    education: [],
                    profilePicture: ''
                };

                const imgPreview = document.getElementById('image-preview');
                if (imgPreview.src && !imgPreview.src.endsWith('#')) {
                    resumeData.profilePicture = getBase64Image(imgPreview);
                }

                document.querySelectorAll('#work-experience-container .experience').forEach(expDiv => {
                    const experience = {
                        jobTitle: expDiv.querySelector('input[name="job-title"]').value,
                        company: expDiv.querySelector('input[name="company"]').value,
                        startDate: expDiv.querySelector('input[name="start-date"]').value,
                        endDate: expDiv.querySelector('input[name="end-date"]').value,
                        description: expDiv.querySelector('textarea[name="job-description"]').value
                    };
                    resumeData.workExperience.push(experience);
                });

                document.querySelectorAll('#education-container .education').forEach(eduDiv => {
                    const education = {
                        degree: eduDiv.querySelector('input[name="degree"]').value,
                        school: eduDiv.querySelector('input[name="school"]').value,
                        startDate: eduDiv.querySelector('input[name="education-start-date"]').value,
                        endDate: eduDiv.querySelector('input[name="education-end-date"]').value
                    };
                    resumeData.education.push(education);
                });

                localStorage.setItem('resumeData', JSON.stringify(resumeData));
                window.location.href = 'preview.html';
            });
        });
    </script>
</body>
</html>
