<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Preview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for the preview page */
        body {
            background-color: #f4f4f4;
        }
        .preview-container {
            background: #fff;
            padding: 2rem;
            margin: 2rem auto;
            max-width: 800px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .preview-section {
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 1.5rem;
        }
        .preview-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .preview-section h2 {
            margin-top: 0;
            border-bottom: 2px solid #333;
            padding-bottom: 0.5rem;
        }
        .preview-profile-pic {
            max-width: 150px;
            border-radius: 50%;
            float: right;
            margin-left: 1rem;
        }
        .work-item, .edu-item {
            margin-bottom: 1rem;
        }
        .work-item h3, .edu-item h3 {
            margin-bottom: 0.25rem;
        }
        .work-item p, .edu-item p {
            margin: 0;
            color: #555;
        }
        .skills-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
        }
        .skills-list li {
            background: #eee;
            color: #333;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
            border-radius: 4px;
        }
        .button-group {
            text-align: center;
            margin-top: 2rem;
        }
        .button-group button {
            margin: 0 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Resume Preview</h1>
        <div id="preview-content">
            <!-- Content will be generated by script -->
        </div>

        <div class="button-group">
            <button id="back-btn">Back to Edit</button>
            <button id="accept-btn">Accept and Generate Resume</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const resumeDataJSON = localStorage.getItem('resumeData');
            if (!resumeDataJSON) {
                document.getElementById('preview-content').innerHTML = '<h1>No data found. Please fill out the form first.</h1>';
                return;
            }

            const data = JSON.parse(resumeDataJSON);
            const previewContent = document.getElementById('preview-content');

            let html = '';

            // Personal Details & Summary
            html += `<div class="preview-section" id="personal-details">`;
            if (data.profilePicture) {
                html += `<img src="${data.profilePicture}" alt="Profile Picture" class="preview-profile-pic">`;
            }
            html += `<h2>${data.name || 'N/A'}</h2>`;
            html += `<p>${data.email || ''} | ${data.phone || ''}</p>`;
            html += `<p>${data.address || ''}</p>`;
            html += `</div>`;

            if (data.summary) {
                html += `<div class="preview-section"><h3>Summary</h3><p>${data.summary}</p></div>`;
            }

            // Work Experience
            if (data.workExperience && data.workExperience.filter(exp => exp.jobTitle).length > 0) {
                html += `<div class="preview-section"><h3>Work Experience</h3>`;
                data.workExperience.forEach(exp => {
                    if (exp.jobTitle) { // Only display if there's a job title
                        html += `<div class="work-item">
                                    <h4>${exp.jobTitle} at ${exp.company || 'N/A'}</h4>
                                    <p><em>${exp.startDate || ''} - ${exp.endDate || 'Present'}</em></p>
                                    <p>${exp.description || ''}</p>
                                 </div>`;
                    }
                });
                html += `</div>`;
            }

            // Education
            if (data.education && data.education.filter(edu => edu.degree).length > 0) {
                html += `<div class="preview-section"><h3>Education</h3>`;
                data.education.forEach(edu => {
                    if (edu.degree) { // Only display if there's a degree
                        html += `<div class="edu-item">
                                    <h4>${edu.degree}</h4>
                                    <p>${edu.school || 'N/A'}</p>
                                    <p><em>${edu.startDate || ''} - ${edu.endDate || 'N/A'}</em></p>
                                 </div>`;
                    }
                });
                html += `</div>`;
            }

            // Skills
            if (data.skills) {
                html += `<div class="preview-section"><h3>Skills</h3><ul class="skills-list">`;
                const skills = data.skills.split(',').map(skill => skill.trim());
                skills.forEach(skill => {
                    if (skill) {
                        html += `<li>${skill}</li>`;
                    }
                });
                html += `</ul></div>`;
            }

            previewContent.innerHTML = html;
        });

        document.getElementById('back-btn').addEventListener('click', function() {
            window.location.href = 'details.html';
        });

        document.getElementById('accept-btn').addEventListener('click', function() {
            window.location.href = 'resume.html';
        });
    </script>
</body>
</html>
